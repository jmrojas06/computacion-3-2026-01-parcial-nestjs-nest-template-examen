services:
  mongo:
    image: mongo:7
    container_name: mongo-bioprocess
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bioprocess}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  # AYUDAS PARCIAL: Si te piden Postgres/SQL descomenta este bloque y comenta mongo arriba
  # Ver src/helpers/app-module-typeorm.example.ts para config completa
  # db:
  #   image: postgres:16
  #   container_name: postgres-db-1
  #   environment:
  #     POSTGRES_USER: ${DB_USERNAME:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #     POSTGRES_DB: ${DB_DATABASE:-mydatabase}
  #   ports:
  #     - "${DB_PORT:-5433}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
